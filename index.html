<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسين علي">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>حسين علي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A2F;--teal:#0F4C5C;--teal2:#1D6B7C;--paper:#F2F5F4;--card:#fff;--line:#E1E8E6;--muted:#66787D;
--paid:#2A9D8F;--part:#E9C46A;--late:#C0392B;--up:#DCE4E2;--gold:#E9C46A;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
header{background:var(--teal);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-end}
header h1{margin:0;font-size:20px;font-weight:700}
header small{opacity:.7;font-size:12px}
header .dt{font-size:12px;opacity:.7;text-align:left}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--teal);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
nav .badge{position:absolute;top:4px;margin-right:22px;background:var(--late);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* الرئيسية */
.hero{background:var(--teal);color:#fff;border-radius:20px;padding:16px 16px 14px;margin-bottom:12px}
.hero .lbl{font-size:12.5px;opacity:.75}
.hero .big{font-size:28px;font-weight:700;letter-spacing:.3px;margin:2px 0}
.hero .usd{font-size:15px;color:var(--gold);font-weight:500}
.hero .bar{height:8px;background:rgba(255,255,255,.15);border-radius:5px;margin:14px 0 6px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.hero .foot{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink)}
.quick svg{width:24px;height:24px;color:var(--teal)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stat{background:var(--card);border-radius:14px;padding:11px 12px;border:1px solid var(--line)}
.stat b{display:block;font-size:17px;margin-top:2px}
.stat small{display:block;color:var(--teal2);font-size:12.5px}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--late)}
h2{font-size:15.5px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:12.5px;color:var(--teal);font-weight:500;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:12.5px}
.strip{display:flex;gap:3px;margin:10px 0 7px}
.strip i{flex:1;height:10px;border-radius:3px;background:var(--up)}
.strip i.p{background:var(--paid)}.strip i.h{background:var(--part)}.strip i.l{background:var(--late)}
.money{font-weight:700;white-space:nowrap}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;background:#E6F1EF;color:var(--teal);white-space:nowrap;font-weight:500}
.tag.late,.tag.r4,.tag.blk{background:#FBE9E7;color:var(--late)}.tag.done,.tag.r1{background:#E7F5EE;color:#1E7F55}
.tag.r2{background:#E6F1EF;color:var(--teal)}.tag.r3{background:#FDF3DC;color:#9A6B00}.tag.usd{background:#FDF3DC;color:#8A6200}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:500;background:var(--teal);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:#E4EFED;color:var(--teal)}.btn.wa{background:#1FA855}.btn.del{background:#FBE9E7;color:var(--late)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts .btn{padding:10px 6px;font-size:13px}
.fab{position:fixed;left:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--ink);border:0;font-size:30px;box-shadow:0 6px 16px rgba(15,76,92,.28);z-index:6;line-height:1}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal2);outline-offset:-1px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 50%,19px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-left:30px}
input[type=checkbox]{width:20px;height:20px;-webkit-appearance:auto;appearance:auto;flex:none}
input[type=date],input[type=month]{text-align:right}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 2px 5px}
label.chk{display:flex;gap:9px;align-items:center;color:var(--ink);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.inrow{display:flex;gap:6px}.inrow input{flex:1}
.search{position:relative;margin-bottom:10px}.search input{padding-right:38px;border-radius:13px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 8px;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.seg{display:flex;background:#E4EBE9;border-radius:12px;padding:3px;gap:3px;margin:4px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--teal);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* النوافذ */
.sheet-bg{position:fixed;inset:0;background:rgba(27,42,47,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:calc(100% - env(safe-area-inset-top,0px) - 14px);display:flex;flex-direction:column;border-radius:20px 20px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:17px}
.sh-head .x{border:0;background:#E4EBE9;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted);flex:none}
.sh-body{overflow:auto;padding:4px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff;display:flex;gap:8px}
.sh-foot .btn{flex:1}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:2px 12px 12px;margin-top:12px}
.sec h4{margin:12px 0 0;font-size:13.5px;color:var(--teal)}
.summary{background:var(--teal);color:#fff;border-radius:14px;padding:12px 14px;margin-top:12px}
.summary .row{padding:3px 0}.summary b{font-size:16px}.summary .g{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:500}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:2px 10px;overflow-x:auto}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:100px;height:68px;border:1.5px dashed #B7C5C2;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);overflow:hidden;position:relative;text-align:center;background:#fff}
.ph img{width:100%;height:100%;object-fit:cover}
.ph input{position:absolute;inset:0;opacity:0}
.empty{text-align:center;color:var(--muted);padding:34px 16px;background:#fff;border:1px dashed #C9D5D2;border-radius:var(--r)}
.warn{background:#FBE9E7;color:var(--late);border-radius:11px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.note{background:#FDF3DC;border:1px solid #F1D48A;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-size:14px;max-width:90%;text-align:center}
.menu .card{display:flex;align-items:center;gap:12px;cursor:pointer}
.menu .ic{width:40px;height:40px;border-radius:12px;background:#E4EFED;color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.menu .ic svg{width:21px;height:21px}
.menu .card>div:nth-child(2){flex:1}
.av{width:38px;height:38px;border-radius:50%;background:#E4EFED;color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.li{display:flex;gap:11px;align-items:center}.li>div:nth-child(2){flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc td,.calc th{text-align:center}.calc tr.on{background:#E4EFED}
/* القفل */
#lock{position:fixed;inset:0;background:var(--teal);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
#lock h2{margin:0 0 6px;font-size:22px}
.dots{display:flex;gap:14px;margin:18px 0 26px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.dots.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px}
.pad button.t{background:none;font-size:14px}
#scan{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;justify-content:center;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
#reader{width:100%;max-width:520px;margin:auto}
#print{display:none}
@media print{@page{margin:10mm}body>*:not(#print){display:none!important}#print{display:block!important}}
.rc{max-width:380px;margin:auto;padding:14px;border:2px solid #000;font-size:14px;color:#000;background:#fff}
.rc h2,.a4 h1{text-align:center;margin:0 0 4px;display:block}.c{text-align:center}.rc hr,.a4 hr{border:0;border-top:1px dashed #000}
.rc .row,.a4 .row{padding:3px 0}
.a4{color:#000;font-size:13.5px}.a4 h1{font-size:22px}.a4 table{margin:8px 0}.a4 td,.a4 th{border:1px solid #000;padding:5px;text-align:center}
.a4 .box{border:1px solid #000;padding:8px;margin:8px 0}.a4 .sig{display:flex;justify-content:space-around;margin-top:40px}
.a4 pre{font-family:inherit;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<header><div><h1 id="shopname">حسين علي</h1><small>نظام الأقساط</small></div><div class="dt" id="hdate"></div></header>
<main id="app"></main>
<button class="fab" id="fab">+</button>
<nav id="nav"></nav>
<div id="print"></div>
<script>
// ================== التخزين ==================
let db,S,L;
const TERMS='1. يلتزم المشتري بتسديد الأقساط في مواعيدها المحددة أعلاه.\n2. يقر المشتري باستلام الجهاز أو المبلغ كاملاً.\n3. في حال التأخر عن تسديد قسطين متتاليين يحق للبائع المطالبة بكامل المبلغ المتبقي.\n4. لا يحق للمشتري بيع الجهاز أو رهنه قبل تسديد كامل المبلغ.';
const EMPTY=()=>({customers:[],devices:[],contracts:[],payments:[],expenses:[],usd:[],deleted:[],
 settings:{shop:'حسين علي',phone:'',address:'',rateBase:'remaining',round:250,roundUsd:5,remindDays:3,terms:TERMS,
 waRemind:'السلام عليكم {الاسم}، نذكركم بموعد قسط {الجهاز} بتاريخ {التاريخ} بمبلغ {المبلغ}. المسدد: {المسدد} - الباقي: {الباقي}. {المحل}',
 waLate:'السلام عليكم {الاسم}، عليكم قسط متأخر بمبلغ {المتأخر} عن {الجهاز}. الباقي الكلي: {الباقي}. نرجو المراجعة. {المحل}'}});
const TABLES=['customers','devices','contracts','payments','expenses','usd'];
const LOCAL=()=>({pinHash:'',bioId:'',lastBackup:0,waMode:'link',umInstance:'',umToken:'',autoSend:false,autoReceipt:false,lastAuto:'',sent:{}});
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('aqsat',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('img')};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function tx(store,mode,fn){return new Promise((ok,no)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));
 t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
const save=()=>tx('kv','readwrite',s=>s.put(S,'state'));
const saveL=()=>tx('kv','readwrite',s=>s.put(L,'local'));
const imgPut=(id,v)=>tx('img','readwrite',s=>s.put(v,id));
const imgGet=id=>id?tx('img','readonly',s=>s.get(id)):Promise.resolve(null);
const imgDel=id=>id?tx('img','readwrite',s=>s.delete(id)):Promise.resolve();

// ================== أدوات ==================
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const AR='٠١٢٣٤٥٦٧٨٩',en=s=>String(s??'').replace(/[٠-٩]/g,d=>AR.indexOf(d));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const num=v=>Number(en(v).replace(/[^\d.]/g,''))||0;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addMonths(d,n){const [y,m,day]=d.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));
 const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(day,last));return t.toISOString().slice(0,10)}
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function normPhone(p){p=en(p).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);
 if(p.startsWith('0'))p='964'+p.slice(1);else if(p.length===10&&p.startsWith('7'))p='964'+p;return p}
const byId=(t,id)=>S[t].find(x=>x.id===id);
function toast(m,ms){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),ms||2300)}
function touch(o){o.updated=Date.now();return o}
function remove(t,id){S[t]=S[t].filter(x=>x.id!==id);S.deleted.push({t,id,at:Date.now()})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cno=c=>c.id.slice(-6).toUpperCase();
// العملات
const curOf=c=>c&&c.cur==='USD'?'USD':'IQD';
const money=(n,cur)=>cur==='USD'?'$'+fmt(n):fmt(n);
const moneyW=(n,cur)=>fmt(n)+(cur==='USD'?' دولار':' دينار');
const unit=cur=>cur==='USD'?'دولار':'د.ع';
const roundOf=cur=>cur==='USD'?(S.settings.roundUsd||5):(S.settings.round||250);
function sumCur(list,fn){const o={IQD:0,USD:0};list.forEach(x=>{const r=fn(x);if(r)o[r[1]]+=r[0]});return o}
const dual=o=>`${fmt(o.IQD)}${o.USD?`<small>$${fmt(o.USD)}</small>`:''}`;
const dualT=o=>o.USD?(o.IQD?`${fmt(o.IQD)} دينار + $${fmt(o.USD)}`:`$${fmt(o.USD)}`):`${fmt(o.IQD)} دينار`;
const dualH=o=>o.USD?(o.IQD?`<bdi dir="ltr">${fmt(o.IQD)}</bdi> دينار + <bdi dir="ltr">$${fmt(o.USD)}</bdi>`:`<bdi dir="ltr">$${fmt(o.USD)}</bdi>`):`<bdi dir="ltr">${fmt(o.IQD)}</bdi> دينار`;
// حقول المبالغ تنكتب بفواصل
function mny(el){const n=num(el.value);el.value=n?n.toLocaleString('en-US'):''}
const mIn=(id,val,extra)=>`<input id="${id}" inputmode="numeric" value="${val?fmt(val):''}" oninput="mny(this);${extra||''}">`;

// ================== الحسابات ==================
function calcContract(price,rate,down,months,base,round){
 price=num(price);rate=num(rate);down=num(down);months=Math.max(1,parseInt(en(months))||1);round=round||250;
 let interest=base==='full'?price*rate/100:Math.max(0,price-down)*rate/100;
 let total=Math.ceil((price+interest)/round)*round;interest=total-price;
 const fin=Math.max(0,total-down);
 let monthly=Math.floor(fin/months/round)*round;if(!monthly)monthly=Math.floor(fin/months);
 return{price,rate,down,months,total,interest,fin,monthly,first:fin-monthly*(months-1)}}
const shiftOf=(c,i)=>(c.shifts||[]).filter(s=>s.from<=i).reduce((a,s)=>a+s.n,0);
const firstDue=c=>c.first||addMonths(c.start,1);
function schedule(c){const out=[],b=firstDue(c);for(let i=1;i<=c.months;i++)
 out.push({i,due:addMonths(b,i-1+shiftOf(c,i)),amount:i===1?c.fin-c.monthly*(c.months-1):c.monthly});return out}
function info(c){
 const pays=S.payments.filter(p=>p.contract===c.id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
 const cash=pays.reduce((a,p)=>a+p.amount,0),disc=pays.reduce((a,p)=>a+(p.discount||0),0),paid=cash+disc;
 const t=today(),sch=schedule(c),delays=[];let left=paid,dueSum=0,lateCount=0,cum=0,pc=0,pi=0;
 sch.forEach(s=>{s.paid=Math.min(s.amount,Math.max(0,left));left-=s.amount;cum+=s.amount;
  while(pi<pays.length&&pc<cum){pc+=pays[pi].amount+(pays[pi].discount||0);pi++}
  s.paidDate=pc>=cum&&pi>0?pays[pi-1].date:null;
  s.st=s.paid>=s.amount?'p':s.due<t?'l':s.paid>0?'h':'u';
  if(s.due<t){dueSum+=s.amount;if(s.st==='l')lateCount++}
  if(s.paidDate)delays.push(Math.max(0,daysBetween(s.due,s.paidDate)));else if(s.due<t)delays.push(daysBetween(s.due,t))});
 const remaining=Math.max(0,c.fin-paid);
 return{pays,paid,cash,disc,paidAll:paid+c.down,remaining,sch,late:Math.max(0,dueSum-paid),lateCount,next:sch.find(s=>s.st!=='p'),done:remaining<=0,delays,cur:curOf(c)}}
function rating(cid){const d=S.contracts.filter(c=>c.customer===cid).flatMap(c=>info(c).delays);

function compress(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}

 sheet(id?'تعديل زبون':'زبون جديد',`<div class="sec"><h4>المعلومات</h4>
 <label>الاسم الكامل</label><input id="c_name" value="${esc(c.name)}">
 <div class="grid2"><div><label>الهاتف</label><input id="c_phone" inputmode="tel" value="${esc(c.phone)}"></div><div><label>المهنة/العمل</label><input id="c_job" value="${esc(c.job)}"></div></div>
 <label>العنوان</label><input id="c_addr" value="${esc(c.address)}"></div>
 <div class="sec"><h4>صور الهوية</h4><div class="photos" style="margin-top:10px">${photoBox('idF','وجه الهوية',c.idF)}${photoBox('idB','ظهر الهوية',c.idB)}</div></div>
 <div class="sec"><h4>ملاحظات</h4><textarea id="c_notes" rows="2" style="margin-top:10px">${esc(c.notes)}</textarea>
 <label class="chk" style="color:var(--late)"><input type="checkbox" id="c_blk" ${c.blocked?'checked':''}> قائمة سوداء (ما ينطي عقد جديد)</label>
 <input id="c_blkr" placeholder="السبب" value="${esc(c.blockReason)}"></div>`,
 `<button class="btn" onclick="saveCustomer('${id||''}')">حفظ</button><button class="btn sec" onclick="${id?`customerView('${id}')`:'closeSheet()'}">إلغاء</button>`)}
async function saveCustomer(id){if(!v('c_name'))return toast('اكتب اسم الزبون');const ph=v('c_phone');
 if(ph&&S.customers.some(x=>x.id!==id&&normPhone(x.phone)===normPhone(ph))&&!confirm('هذا الرقم مسجل لزبون ثاني. تكمل؟'))return;
 const c=id?byId('customers',id):{id:uid(),created:Date.now()};
 Object.assign(c,{name:v('c_name'),phone:ph,job:v('c_job'),address:v('c_addr'),notes:v('c_notes'),blocked:document.getElementById('c_blk').checked,blockReason:v('c_blkr')});
 for(const k of ['idF','idB'])if(pending[k]){await imgDel(c[k]);c[k]=uid();await imgPut(c[k],pending[k])}
 touch(c);if(!id)S.customers.push(c);await save();toast('انحفظ الزبون');render();customerView(c.id)}
function customerView(id){const c=byId('customers',id);const cs=S.contracts.filter(x=>x.customer===id);const r=rating(id);
 sheet(esc(c.name),`<div class="row" style="margin-top:8px"><div class="sub">${esc(c.phone)} ${c.job?'• '+esc(c.job):''} ${c.address?'• '+esc(c.address):''}</div>${c.blocked?'<span class="tag blk">قائمة سوداء</span>':rtag(r)}</div>
 ${c.blocked?`<div class="warn">قائمة سوداء${c.blockReason?': '+esc(c.blockReason):''}</div>`:''}
 ${r.k?`<div class="sub" style="margin-top:6px">معدل التأخير ${r.avg} يوم، وأكثر تأخير ${r.max} يوم (${r.count} قسط)</div>`:''}
 ${c.notes?`<div class="sub">${esc(c.notes)}</div>`:''}
 <div class="acts"><button class="btn" onclick="contractForm(null,'${id}')">عقد جهاز</button><button class="btn" onclick="contractForm(null,'${id}',{kind:'cash',cur:'USD'})">إعطاء دولار</button>
 ${c.phone?`<a class="btn sec" href="tel:${esc(c.phone)}">اتصال</a>`:'<span></span>'}
 ${cs.length?`<button class="btn wa" onclick="statementWA('${id}')">كشف حساب</button>`:''}
 ${c.idF?`<button class="btn sec" onclick="showImg('${c.idF}','${id}')">وجه الهوية</button>`:''}${c.idB?`<button class="btn sec" onclick="showImg('${c.idB}','${id}')">ظهر الهوية</button>`:''}</div>
 <h2>العقود (${cs.length})</h2>${cs.map(contractCard).join('')||'<div class="card sub">ماكو عقود</div>'}`,
 `<button class="btn sec" onclick="customerForm('${id}')">تعديل</button><button class="btn del" onclick="delCustomer('${id}')">حذف</button>`)}
async function delCustomer(id){if(S.contracts.some(c=>c.customer===id))return toast('الزبون عنده عقود، احذف عقوده أول');
 if(!confirm('تأكيد حذف الزبون؟'))return;const c=byId('customers',id);await imgDel(c.idF);await imgDel(c.idB);
 remove('customers',id);await save();closeSheet();toast('انحذف الزبون');render()}

// ---------- المخزن ----------
function deviceForm(id){const d=id?byId('devices',id):{cat:'موبايل'};
 sheet(id?'تعديل جهاز':'جهاز جديد للمخزن',`<div class="sec"><h4>الجهاز</h4>
 <label>النوع</label><select id="d_cat">${['موبايل','تابلت','لابتوب','تلفزيون','ثلاجة','غسالة','مكيف','مجمدة','طباخ','أخرى'].map(x=>`<option ${d.cat===x?'selected':''}>${x}</option>`).join('')}</select>
 <div class="grid2"><div><label>الشركة</label><input id="d_brand" value="${esc(d.brand)}" placeholder="Samsung"></div><div><label>الموديل</label><input id="d_model" value="${esc(d.model)}" placeholder="A55 256GB"></div></div>
 <label>IMEI / الرقم التسلسلي</label>${scanBtn('d_imei')}</div>
 <div class="sec"><h4>السعر بالدينار</h4><div class="grid2"><div><label>سعر الشراء (الكلفة)</label>${mIn('d_cost',d.cost)}</div><div><label>سعر البيع نقداً</label>${mIn('d_price',d.price)}</div></div></div>
 ${d.status==='sold'?'<div class="sub" style="margin-top:10px">هذا الجهاز مباع بعقد. تعديله ما يغيّر حسابات العقد.</div>':''}`,
 `<button class="btn" onclick="saveDevice('${id||''}')">حفظ</button>${id?`<button class="btn del" onclick="delDevice('${id}')">حذف</button>`:`<button class="btn sec" onclick="closeSheet()">إلغاء</button>`}`);
 document.getElementById('d_imei').value=d.imei||''}
async function saveDevice(id){if(!v('d_model'))return toast('اكتب الموديل');const imei=en(v('d_imei'));
 if(imei&&S.devices.some(x=>x.imei===imei&&x.id!==id))return toast('هذا الـ IMEI مسجل من قبل');
 const d=id?byId('devices',id):{id:uid(),status:'stock',created:Date.now()};
 Object.assign(d,{cat:v('d_cat'),brand:v('d_brand'),model:v('d_model'),imei,cost:num(v('d_cost')),price:num(v('d_price'))});
 touch(d);if(!id)S.devices.push(d);await save();closeSheet();toast('انحفظ الجهاز');render()}
async function delDevice(id){const d=byId('devices',id);
 if(S.contracts.some(c=>c.deviceId===id))return toast('الجهاز مربوط بعقد، احذف العقد أول');
 if(!confirm('حذف الجهاز؟'))return;remove('devices',id);await save();closeSheet();toast('انحذف الجهاز');render()}
// صندوق الدولار
function usdForm(id,sign){const x=id?byId('usd',id):{amount:0,date:today()};sign=id?(x.amount<0?-1:1):sign;
 sheet(id?'تعديل حركة دولار':sign>0?'إضافة دولار للصندوق':'سحب دولار من الصندوق',`<div class="sec">
 <div class="seg" id="u_sg" style="margin-top:12px"><button data-v="1" class="${sign>0?'on':''}" onclick="segSet('u_sg',1)">إضافة</button><button data-v="-1" class="${sign<0?'on':''}" onclick="segSet('u_sg',-1)">سحب</button></div>
 <label>المبلغ بالدولار</label>${mIn('u_amt',Math.abs(x.amount))}
 <label>التاريخ</label><input id="u_date" type="date" value="${x.date}">
 <label>ملاحظة</label><input id="u_note" value="${esc(x.note)}" placeholder="مثلاً: شراء دولار من الصراف"></div>`,
 `<button class="btn" onclick="saveUsd('${id||''}')">حفظ</button>${id?`<button class="btn del" onclick="delUsd('${id}')">حذف</button>`:`<button class="btn sec" onclick="closeSheet()">إلغاء</button>`}`)}
async function saveUsd(id){const a=num(v('u_amt'));if(!a)return toast('اكتب المبلغ');const sg=document.querySelector('#u_sg .on').dataset.v==='-1'?-1:1;
 const x=id?byId('usd',id):{id:uid(),created:Date.now()};Object.assign(x,{amount:a*sg,date:v('u_date')||today(),note:v('u_note')});touch(x);
 if(!id)S.usd.push(x);await save();closeSheet();toast('انحفظت');render()}
async function delUsd(id){if(!confirm('حذف هذه الحركة؟'))return;remove('usd',id);await save();closeSheet();toast('انحذفت');render()}

// ---------- العقد ----------
let K={};
function contractForm(editId,custId,pre){if(!S.customers.length){toast('ضيف زبون أول');return customerForm()}
 const c=editId?byId('contracts',editId):null;pre=pre||{};
 K={kind:c?(c.kind||'device'):(pre.kind||'device'),cur:c?curOf(c):(pre.cur||'IQD'),firstTouched:!!(c&&c.first)};
 const st=S.devices.filter(d=>d.status!=='sold'||(c&&d.id===c.deviceId));
 const rate=c?c.rate:(pre.rate??25),mon=c?c.months:(pre.months||10);custId=c?c.customer:custId;const start=c?c.start:today();
 sheet(c?'تعديل العقد':'عقد تقسيط جديد',`
 <div class="seg" id="k_kind" style="margin-top:12px"><button data-v="device" onclick="setKind('device')">جهاز</button><button data-v="cash" onclick="setKind('cash')">دولار / كاش</button></div>
 <div class="sec"><h4>الزبون</h4><select id="k_cust" onchange="custWarn()" style="margin-top:10px">${[...S.customers].sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(x=>`<option value="${x.id}" ${x.id===custId?'selected':''}>${x.blocked?'⛔ ':''}${esc(x.name)} - ${esc(x.phone)}</option>`).join('')}</select>
 <div id="k_warn"></div></div>
 <div class="sec" id="k_devsec"><h4>الجهاز</h4>
 <label>من المخزن</label><select id="k_dev" onchange="pickDev()"><option value="">— جهاز خارج المخزن (اكتبه يدوياً) —</option>
 ${st.map(d=>`<option value="${d.id}" ${c&&c.deviceId===d.id?'selected':''}>${esc(d.brand)} ${esc(d.model)} ${d.imei?'• '+esc(d.imei):''}</option>`).join('')}</select>
 <label>وصف الجهاز</label><input id="k_desc" value="${esc(c&&c.kind!=='cash'?c.device:'')}"><label>IMEI</label>${scanBtn('k_imei')}</div>
 <div class="sec"><h4>المبلغ والفائدة</h4>
 <label>العملة</label><div class="seg" id="k_cur"><button data-v="IQD" onclick="setCur('IQD')">دينار</button><button data-v="USD" onclick="setCur('USD')">دولار $</button></div>
 <div class="grid2"><div><label id="k_plbl">سعر الجهاز</label>${mIn('k_price',c?c.price:pre.price,'calc()')}</div><div id="k_costw"><label>الكلفة عليك</label>${mIn('k_cost',c&&c.kind!=='cash'?c.cost:0)}</div></div>
 <div id="k_usdinfo"></div>
 <label>نسبة الفائدة %</label><div class="chips" id="rates">${[10,15,20,25,30,35,40].map(r=>`<button class="chip ${r==rate?'on':''}" onclick="setRate(${r})">${r}%</button>`).join('')}</div>
 <input id="k_rate" inputmode="decimal" value="${rate}" oninput="calc();markChips('rates',this.value)">
 <div id="k_downw"><label>المقدمة (اختياري)</label>${mIn('k_down',c?c.down:pre.down,'calc()').replace('<input','<input placeholder="بدون مقدمة"')}</div></div>
 <div class="sec"><h4>الأقساط</h4>
 <label>عدد الأشهر</label><div class="chips" id="mons">${[3,4,5,6,8,10,12,18,24].map(m=>`<button class="chip ${m==mon?'on':''}" onclick="setMon(${m})">${m}</button>`).join('')}</div>
 <input id="k_months" type="number" inputmode="numeric" value="${mon}" oninput="calc();markChips('mons',this.value)">
 <div class="grid2"><div><label id="k_slbl">تاريخ البيع</label><input id="k_start" type="date" value="${start}" onchange="autoFirst()"></div>
 <div><label>موعد أول قسط</label><input id="k_first" type="date" value="${c?firstDue(c):addMonths(start,1)}" onchange="K.firstTouched=true;calc()"></div></div>
 <label>ملاحظات</label><input id="k_notes" value="${esc(c?.notes)}"></div>
 <div class="summary" id="k_sum"></div>`,
 `<button class="btn" onclick="saveContract('${editId||''}')">${c?'حفظ التعديل':'حفظ العقد'}</button><button class="btn sec" onclick="${c?`contractView('${c.id}')`:'closeSheet()'}">إلغاء</button>`);
 document.getElementById('k_imei').value=c?.imei||'';setKind(K.kind,1);setCur(K.cur,1);calc();custWarn()}
function setKind(k,init){K.kind=k;segSet('k_kind',k);const cash=k==='cash';
 document.getElementById('k_devsec').style.display=cash?'none':'';document.getElementById('k_costw').style.display=cash?'none':'';
 document.getElementById('k_downw').style.display=cash?'none':'';
 document.getElementById('k_plbl').textContent=cash?'المبلغ المعطى':'سعر الجهاز';document.getElementById('k_slbl').textContent=cash?'تاريخ الاستلام':'تاريخ البيع';
 if(!init&&cash)setCur('USD');else calc()}
function setCur(cu,init){K.cur=cu;segSet('k_cur',cu);if(!init)calc();else calc()}
function autoFirst(){if(!K.firstTouched&&v('k_start'))document.getElementById('k_first').value=addMonths(v('k_start'),1);calc()}
function custWarn(){const cu=byId('customers',v('k_cust'));const el=document.getElementById('k_warn');if(!cu||!el)return;const r=rating(cu.id);
 const late=sumCur(S.contracts.filter(x=>x.customer===cu.id),x=>{const i=info(x);return[i.late,i.cur]});
 el.innerHTML=cu.blocked?`<div class="warn">⛔ هذا الزبون بالقائمة السوداء${cu.blockReason?': '+esc(cu.blockReason):''}</div>`:
 (late.IQD||late.USD)?`<div class="warn">عليه أقساط متأخرة ${dualH(late)} بعقود ثانية</div>`:r.k>=3?`<div class="warn">تقييمه "${r.n}" — معدل تأخيره ${r.avg} يوم</div>`:''}
function markChips(g,val){document.querySelectorAll('#'+g+' .chip').forEach(b=>b.classList.toggle('on',parseFloat(b.textContent)==parseFloat(en(val))))}
function setRate(r){document.getElementById('k_rate').value=r;markChips('rates',r);calc()}
function setMon(m){document.getElementById('k_months').value=m;markChips('mons',m);calc()}
function pickDev(){const d=byId('devices',v('k_dev'));if(!d)return;
 document.getElementById('k_desc').value=`${d.cat} ${d.brand} ${d.model}`.trim();document.getElementById('k_imei').value=d.imei||'';
 if(K.cur==='IQD'){document.getElementById('k_price').value=d.price?fmt(d.price):'';document.getElementById('k_cost').value=d.cost?fmt(d.cost):''}
 else toast('أسعار المخزن بالدينار، اكتب السعر بالدولار');calc()}
function calc(){const cash=K.kind==='cash',cur=K.cur;
 const r=calcContract(v('k_price'),v('k_rate'),cash?0:v('k_down'),v('k_months'),S.settings.rateBase,roundOf(cur));
 const ui=document.getElementById('k_usdinfo');if(ui){const b=usdBox().bal;ui.innerHTML=cash&&cur==='USD'?`<div class="sub" style="margin-top:6px">رصيد صندوق الدولار: $${fmt(b)}${r.price>b?' <b style="color:var(--late)">— أقل من المبلغ</b>':''}</div>`:''}
 const M=n=>money(n,cur);
 document.getElementById('k_sum').innerHTML=`<div class="row"><span>${cash?'المبلغ المعطى':'سعر الجهاز'}</span><span>${M(r.price)}</span></div>
 <div class="row"><span>الفائدة ${r.rate}%</span><span>+ ${M(r.interest)}</span></div>
 <div class="row"><span>المبلغ الكامل بالتقسيط</span><b>${M(r.total)}</b></div>
 ${r.down?`<div class="row"><span>المقدمة</span><span>− ${M(r.down)}</span></div>`:''}
 <div class="row"><span>على ${r.months} شهر${v('k_first')?' من '+v('k_first'):''}</span><span>${M(r.fin)}</span></div>
 ${r.first!==r.monthly?`<div class="row"><span>القسط الأول (ويا الفرق)</span><b>${M(r.first)}</b></div>`:''}
 <div class="row"><span>القسط الشهري${r.first!==r.monthly?' (الباقي)':''}</span><b class="g">${M(r.monthly)}</b></div>`;return r}
async function saveContract(editId){const r=calc(),cash=K.kind==='cash',cur=K.cur;if(!r.price)return toast(cash?'اكتب المبلغ':'اكتب سعر الجهاز');
 if(!cash&&!v('k_desc'))return toast('اكتب وصف الجهاز');if(r.down&&r.down>=r.total)return toast('المقدمة أكبر من المبلغ');
 if(v('k_first')&&v('k_first')<v('k_start'))return toast('موعد أول قسط قبل تاريخ البيع');
 const cu=byId('customers',v('k_cust'));if(cu.blocked&&!confirm('الزبون بالقائمة السوداء. تكمل العقد؟'))return;
 if(cash&&cur==='USD'&&!editId&&r.price>usdBox().bal&&!confirm('المبلغ أكثر من رصيد صندوق الدولار. تكمل؟'))return;
 const old=editId?byId('contracts',editId):null;
 if(old){const paid=info(old).paid;if(paid>r.fin)return toast('المسدد ('+fmt(paid)+') أكثر من المبلغ الجديد')}
 const devId=cash?null:(v('k_dev')||null);
 const c=old||{id:uid(),created:Date.now(),shifts:[]};
 if(old&&old.deviceId&&old.deviceId!==devId){const d=byId('devices',old.deviceId);if(d){d.status='stock';touch(d)}}
 const start=v('k_start')||today(),first=v('k_first');
 Object.assign(c,{kind:K.kind,cur,customer:cu.id,deviceId:devId,device:cash?'كاش '+money(r.price,cur):v('k_desc'),imei:cash?'':en(v('k_imei')),
  cost:cash?r.price:num(v('k_cost')),price:r.price,rate:r.rate,interest:r.interest,total:r.total,down:r.down,fin:r.fin,months:r.months,monthly:r.monthly,
  start,first:first&&first!==addMonths(start,1)?first:null,notes:v('k_notes')});touch(c);
 if(!old)S.contracts.push(c);if(devId){const d=byId('devices',devId);d.status='sold';touch(d)}
 await save();toast(old?'انحفظ التعديل':'انحفظ العقد');render();contractView(c.id)}
function contractView(id){const c=byId('contracts',id),ci=info(c),cu=byId('customers',c.customer)||{},cur=ci.cur,M=n=>money(n,cur);
 const nm={p:'مسدد',h:'جزئي',l:'متأخر',u:'—'};
 sheet(esc(cu.name),`<div class="row" style="margin-top:8px"><div class="sub">${c.kind==='cash'?'<span class="tag usd">كاش</span> ':''}${esc(c.device)} ${c.imei?'• IMEI '+esc(c.imei):''}</div><span class="sub">عقد ${cno(c)}</span></div>
 ${strip(ci)}
 <div class="summary"><div class="row"><span>المبلغ الكامل (فائدة ${c.rate}%)</span><b>${M(c.total)}</b></div>
 <div class="row"><span>المسدد${c.down?` (مع المقدمة ${M(c.down)})`:''}</span><b>${M(ci.paidAll)}</b></div>
 ${ci.disc?`<div class="row"><span>خصم تسديد مبكر</span><span>${M(ci.disc)}</span></div>`:''}
 <div class="row"><span>الباقي</span><b class="g">${M(ci.remaining)}</b></div>
 ${ci.late?`<div class="row"><span>متأخر</span><b>${M(ci.late)}</b></div>`:''}
 <div class="row"><span>القسط الشهري × ${c.months}</span><span>${M(c.monthly)}${ci.sch[0].amount!==c.monthly?` (الأول ${M(ci.sch[0].amount)})`:''}</span></div>
 <div class="row"><span>تاريخ ${c.kind==='cash'?'الاستلام':'البيع'}</span><span>${c.start}</span></div></div>
 <div class="acts">${ci.done?'':`<button class="btn" onclick="payForm('${id}')">تسديد قسط</button><button class="btn sec" onclick="earlyForm('${id}')">تسديد كامل</button><button class="btn sec" onclick="postponeForm('${id}')">تأجيل</button>`}
 <button class="btn wa" onclick="sendWA('${id}','${ci.late?'late':'soon'}')">واتساب</button><button class="btn sec" onclick="printContract('${id}')">طباعة العقد</button><button class="btn sec" onclick="customerView('${c.customer}')">ملف الزبون</button></div>
 ${(c.shifts||[]).length?`<h2>التأجيلات</h2>${c.shifts.map((s,k)=>`<div class="card row"><span>من القسط ${s.from}: ${s.n} شهر ${s.note?'— '+esc(s.note):''}</span><button class="btn del sm" onclick="delShift('${id}',${k})">إلغاء</button></div>`).join('')}`:''}
 <h2>جدول الأقساط</h2><div class="tbl"><table><tr><th>#</th><th>الموعد</th><th>القسط</th><th>المسدد</th><th>الحالة</th></tr>
 ${ci.sch.map(s=>`<tr><td>${s.i}</td><td>${s.due}</td><td>${fmt(s.amount)}</td><td>${fmt(s.paid)}</td><td style="color:${s.st==='l'?'var(--late)':s.st==='p'?'var(--paid)':'inherit'}">${nm[s.st]}</td></tr>`).join('')}</table></div>
 <h2>التسديدات (${ci.pays.length})</h2>${ci.pays.map(p=>`<div class="card"><div class="row"><b>${M(p.amount)}${p.discount?` <span class="sub">+ خصم ${M(p.discount)}</span>`:''}</b><span class="sub">${p.date} • وصل <bdi>${p.no}</bdi></span></div>
 ${p.note?`<div class="sub">${esc(p.note)}</div>`:''}<div class="btns"><button class="btn sec sm" onclick="receipt('${p.id}')">الوصل</button><button class="btn sec sm" onclick="payForm('${id}','${p.id}')">تعديل</button><button class="btn del sm" onclick="delPay('${p.id}')">حذف</button></div></div>`).join('')||'<div class="card sub">ماكو تسديدات بعد</div>'}`,

function fill(t,c,ci){const cu=byId('customers',c.customer)||{},cur=ci.cur;const rep={'{الاسم}':cu.name,'{الجهاز}':c.kind==='cash'?'مبلغ '+money(c.price,cur):'جهاز '+c.device,'{التاريخ}':ci.next?ci.next.due:'',
 '{المبلغ}':moneyW(ci.next?ci.next.amount-ci.next.paid:0,cur),'{المسدد}':moneyW(ci.paidAll,cur),'{الباقي}':moneyW(ci.remaining,cur),'{المتأخر}':moneyW(ci.late,cur),'{المحل}':S.settings.shop||''};
 for(const k in rep)t=t.split(k).join(rep[k]??'');return t}
function openWA(phone,text){const n=normPhone(phone);if(!n)return toast('الزبون ما عنده رقم');window.open(`https://wa.me/${n}?text=${encodeURIComponent(text)}`,'_blank')}
async function apiSend(phone,text){const n=normPhone(phone);if(!n||!L.umInstance||!L.umToken)return false;
 const url=`https://api.ultramsg.com/${encodeURIComponent(L.umInstance)}/messages/chat`;
 const body=new URLSearchParams({token:L.umToken,to:'+'+n,body:text});
 try{const r=await fetch(url,{method:'POST',body});const j=await r.json().catch(()=>({}));return r.ok&&!j.error}
 catch(e){try{await fetch(url,{method:'POST',body,mode:'no-cors'});return true}catch(e2){return false}}}
async function sendMsg(phone,text){if(L.waMode==='api'){toast('جاري الإرسال...');const ok=await apiSend(phone,text);toast(ok?'انرسلت الرسالة':'ما انرسلت، تأكد من الإنترنت وإعدادات البوابة',3000);return ok}
 openWA(phone,text);return true}
const sentKey=(c,i,kind)=>kind==='late'?c.id+':late':c.id+':soon:'+(i.next?i.next.due:'');
function dueLists(){const t=today(),d=S.settings.remindDays||3;const L2=S.contracts.map(c=>[c,info(c)]).filter(([,i])=>!i.done&&i.next);
 return{late:L2.filter(([,i])=>i.late>0),soon:L2.filter(([,i])=>i.late<=0&&daysBetween(t,i.next.due)<=d)}}
async function sendWA(id,kind){const c=byId('contracts',id),ci=info(c),cu=byId('customers',c.customer)||{};
 const ok=await sendMsg(cu.phone,fill(kind==='late'?S.settings.waLate:S.settings.waRemind,c,ci));
 if(ok){L.sent[sentKey(c,ci,kind)]=today();await saveL();if(tab==='remind')render()}}
async function bulkSend(auto){const {late,soon}=dueLists();const jobs=[...late.map(x=>[...x,'late']),...soon.map(x=>[...x,'soon'])].filter(([c,i,k])=>{
 if(!auto)return true;const last=L.sent[sentKey(c,i,k)];return k==='soon'?!last:(!last||daysBetween(last,today())>=3)});
 if(!jobs.length){if(!auto)toast('ماكو رسائل');return}
 if(!auto&&!confirm(`إرسال ${jobs.length} رسالة؟`))return;let ok=0;
 for(const [c,i,k] of jobs){const cu=byId('customers',c.customer);if(!cu?.phone)continue;
  if(await apiSend(cu.phone,fill(k==='late'?S.settings.waLate:S.settings.waRemind,c,i))){ok++;L.sent[sentKey(c,i,k)]=today()}await sleep(1500)}
 await saveL();toast(`انرسلت ${ok} من ${jobs.length} رسالة تذكير`,3500);if(tab==='remind')render()}
function statementWA(cid){const cu=byId('customers',cid);let t=`كشف حساب: ${cu.name}\nالتاريخ: ${today()}\n`;
 const tot=sumCur(S.contracts.filter(c=>c.customer===cid),c=>{const ci=info(c),cur=ci.cur,W=n=>moneyW(n,cur);
  t+=`\n— ${c.device} (عقد ${cno(c)})\nالمبلغ الكامل: ${W(c.total)}\nالمسدد: ${W(ci.paidAll)}\nالباقي: ${W(ci.remaining)}${ci.late?'\nالمتأخر: '+W(ci.late):''}${!ci.done&&ci.next?'\nالقسط القادم: '+ci.next.due+' بمبلغ '+W(ci.next.amount-ci.next.paid):''}\n`;
  ci.pays.slice(-5).forEach(p=>t+=`  • ${p.date}: ${money(p.amount,cur)}\n`);return[ci.remaining,cur]});
 t+=`\nمجموع الباقي عليك: ${dualT(tot)}\n${S.settings.shop||''}`;sendMsg(cu.phone,t)}

 <div class="summary"><div class="row"><span>مجموع مصاريف الشهر</span><b class="g">${fmt(tot)} دينار</b></div>
 ${Object.entries(by).map(([k,a])=>`<div class="row"><span>${esc(k)}</span><span>${fmt(a)}</span></div>`).join('')}</div>
 <h2>التفاصيل</h2>${L2.map(e=>`<div class="card row" onclick="expenseForm('${e.id}')"><div><b>${esc(e.cat)}</b><div class="sub">${e.date}${e.note?' • '+esc(e.note):''}</div></div><span class="money">${fmt(e.amount)}</span></div>`).join('')||'<div class="empty">ماكو مصاريف بهذا الشهر</div>'}`,
 `<button class="btn" onclick="expenseForm()">إضافة مصروف</button>`)}
function expenseForm(id){const e=id?byId('expenses',id):{cat:'إيجار',date:today()};
 sheet(id?'تعديل مصروف':'مصروف جديد',`<div class="sec"><label>النوع</label><div class="chips" id="x_cats">${ECATS.map(c=>`<button class="chip ${e.cat===c?'on':''}" onclick="document.getElementById('x_cat').value='${c}';document.querySelectorAll('#x_cats .chip').forEach(b=>b.classList.toggle('on',b.textContent==='${c}'))">${c}</button>`).join('')}</div>
 <input id="x_cat" value="${esc(e.cat)}" oninput="document.querySelectorAll('#x_cats .chip').forEach(b=>b.classList.toggle('on',b.textContent===this.value))">
 <label>المبلغ (دينار)</label>${mIn('x_amt',e.amount)}
 <label>التاريخ</label><input id="x_date" type="date" value="${e.date}"><label>ملاحظة</label><input id="x_note" value="${esc(e.note)}"></div>`,
 `<button class="btn" onclick="saveExpense('${id||''}')">حفظ</button>${id?`<button class="btn del" onclick="delExpense('${id}')">حذف</button>`:`<button class="btn sec" onclick="closeSheet()">إلغاء</button>`}`)}
async function saveExpense(id){const a=num(v('x_amt'));if(!a)return toast('اكتب المبلغ');if(!v('x_cat'))return toast('اختار النوع');
 const e=id?byId('expenses',id):{id:uid(),created:Date.now()};Object.assign(e,{cat:v('x_cat'),amount:a,date:v('x_date')||today(),note:v('x_note')});touch(e);
 if(!id)S.expenses.push(e);await save();toast('انحفظ المصروف');expMonth=e.date.slice(0,7);render();expensesView()}
async function delExpense(id){if(!confirm('حذف المصروف؟'))return;remove('expenses',id);await save();toast('انحذف');render();expensesView()}

// ---------- التقارير ----------
function reportForm(){sheet('التقرير الشهري',`<label>الشهر</label><input id="r_m" type="month" value="${today().slice(0,7)}" onchange="report()"><div id="r_out"></div>`,
 `<button class="btn" onclick="doPrint('<div class=a4>'+document.getElementById('r_out').innerHTML+'</div>')">طباعة</button>`);report()}
function report(){const m=v('r_m');const cs=S.contracts.filter(c=>c.start.startsWith(m));const ps=S.payments.filter(p=>p.date.startsWith(m));
 const pc=p=>curOf(byId('contracts',p.contract));
 let dueN=0,paidN=0;const due=sumCur([],x=>x),duePaid=sumCur([],x=>x);
 S.contracts.forEach(c=>{const cur=curOf(c);info(c).sch.forEach(s=>{if(s.due.startsWith(m)){dueN++;due[cur]+=s.amount;duePaid[cur]+=s.paid;if(s.st==='p')paidN++}})});
 const devs=cs.filter(c=>c.kind!=='cash'),cashC=cs.filter(c=>c.kind==='cash');
 const coll=sumCur(ps,p=>[p.amount,pc(p)]),disc=sumCur(ps,p=>[p.discount||0,pc(p)]),downs=sumCur(cs,c=>[c.down,curOf(c)]);
 const prof=sumCur(cs,c=>[c.total-(c.cost||0),curOf(c)]);const exp=S.expenses.filter(e=>e.date.startsWith(m)).reduce((a,e)=>a+e.amount,0);
 const lateNow=sumCur(S.contracts,c=>{const i=info(c);return[i.late,i.cur]});
 const R=(a,b,x)=>`<div class="row"><span>${a}</span>${x?'<b>'+b+'</b>':'<span>'+b+'</span>'}</div>`;
 const net={IQD:prof.IQD-exp,USD:prof.USD};
 document.getElementById('r_out').innerHTML=`<h2>${esc(S.settings.shop||'')} — تقرير ${m}</h2>
 <div class="card"><b>العقود</b>${R('عقود أجهزة',devs.length)}${R('قيمة عقود الأجهزة',dualH(sumCur(devs,c=>[c.total,curOf(c)])))}
 ${R('عقود دولار/كاش',cashC.length)}${cashC.length?R('المبالغ المعطاة',dualH(sumCur(cashC,c=>[c.price,curOf(c)]))):''}${R('ربح عقود هذا الشهر',dualH(prof),1)}</div>
 <div class="card"><b>الاستلام</b>${R('المقدمات',dualH(downs))}${R('الأقساط المستلمة',dualH(coll),1)}${disc.IQD||disc.USD?R('خصومات تسديد مبكر',dualH(disc)):''}</div>
 <div class="card"><b>التحصيل</b>${R('أقساط مستحقة هذا الشهر',dualH(due))}${R('المسدد منها',dualH(duePaid))}${R('نسبة التحصيل',dueN?Math.round(paidN/dueN*100)+'% ('+paidN+' من '+dueN+')':'—',1)}${R('مجموع المتأخر الكلي هسه',dualH(lateNow))}</div>
 <div class="card"><b>المصاريف والصافي</b>${R('المصاريف','<bdi dir="ltr">'+fmt(exp)+'</bdi> دينار')}${R('صافي الربح',dualH(net),1)}</div>`}
function rankView(){const L2=S.customers.filter(c=>S.contracts.some(x=>x.customer===c.id)).map(c=>[c,rating(c.id)]).sort((a,b)=>(a[1].k||0)-(b[1].k||0)||a[1].avg-b[1].avg);
 sheet('ترتيب الزبائن',`<div class="sub" style="margin-top:10px">حسب معدل أيام التأخير: ملتزم (٣ أيام أو أقل)، جيد (لحد ١٥)، يتأخر (لحد ٤٥)، متعثر (أكثر).</div><div style="height:10px"></div>
 ${L2.map(([c,r])=>`<div class="card li" onclick="customerView('${c.id}')"><div class="av">${initial(c.name)}</div><div><div class="row"><b>${esc(c.name)}</b>${c.blocked?'<span class="tag blk">قائمة سوداء</span>':rtag(r)}</div>
 <div class="sub">${r.k?`معدل التأخير ${r.avg} يوم • أكثر تأخير ${r.max} يوم • ${r.count} قسط`:'ماكو أقساط مستحقة بعد'}</div></div></div>`).join('')||'<div class="empty">ماكو زبائن بعقود</div>'}`)}

// ---------- الإعدادات ----------
function settingsForm(){const s=S.settings;sheet('معلومات المحل والرسائل',`<div class="sec"><h4>المحل</h4>
 <label>اسم المحل</label><input id="s_shop" value="${esc(s.shop)}"><label>رقم الهاتف</label><input id="s_phone" value="${esc(s.phone)}" inputmode="tel">
 <label>العنوان</label><input id="s_addr" value="${esc(s.address)}"></div>
 <div class="sec"><h4>الحسابات</h4>
 <label>الفائدة تنحسب على</label><select id="s_base"><option value="remaining" ${s.rateBase!=='full'?'selected':''}>الباقي بعد المقدمة</option><option value="full" ${s.rateBase==='full'?'selected':''}>السعر الكامل</option></select>
 <div class="grid2"><div><label>تقريب الدينار إلى</label><select id="s_round">${[250,500,1000,5000].map(x=>`<option ${s.round==x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><label>تقريب الدولار إلى</label><select id="s_roundu">${[1,5,10].map(x=>`<option ${(s.roundUsd||5)==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <label>التذكير قبل موعد القسط (أيام)</label><input id="s_days" type="number" inputmode="numeric" value="${s.remindDays||3}"></div>
 <div class="sec"><h4>الرسائل</h4>
 <label>رسالة التذكير بالموعد</label><textarea id="s_wr" rows="4">${esc(s.waRemind)}</textarea>
 <label>رسالة المتأخرين</label><textarea id="s_wl" rows="4">${esc(s.waLate)}</textarea>
 <div class="sub" style="margin-top:6px">الكلمات: {الاسم} {الجهاز} {التاريخ} {المبلغ} {المسدد} {الباقي} {المتأخر} {المحل}. المبالغ تطلع ويا عملتها.</div></div>
 <div class="sec"><h4>شروط العقد المطبوع</h4><textarea id="s_terms" rows="6" style="margin-top:10px">${esc(s.terms||TERMS)}</textarea></div>`,
 `<button class="btn" onclick="saveSettings()">حفظ</button><button class="btn sec" onclick="closeSheet()">إلغاء</button>`)}
async function saveSettings(){Object.assign(S.settings,{shop:v('s_shop'),phone:v('s_phone'),address:v('s_addr'),rateBase:v('s_base'),round:num(v('s_round'))||250,roundUsd:num(v('s_roundu'))||5,
 remindDays:num(v('s_days'))||3,waRemind:v('s_wr'),waLate:v('s_wl'),terms:v('s_terms'),updated:Date.now()});await save();closeSheet();toast('انحفظت الإعدادات');render()}
function waForm(){sheet('بوابة الواتساب',`<div class="sec">
 <label>طريقة الإرسال</label><select id="w_mode"><option value="link" ${L.waMode!=='api'?'selected':''}>يفتح الواتساب والرسالة جاهزة (مجاني)</option><option value="api" ${L.waMode==='api'?'selected':''}>إرسال من داخل النظام عبر UltraMsg</option></select>
 <div class="sub" style="margin-top:10px">للإرسال من داخل النظام: سوّي حساب بموقع ultramsg.com، واربط رقم واتساب المحل بمسح الـ QR، وانسخ Instance ID والـ Token هنا. الخدمة مدفوعة شهرياً.</div>
 <label>Instance ID</label><input id="w_inst" dir="ltr" value="${esc(L.umInstance)}" placeholder="instance12345">
 <label>Token</label><input id="w_tok" dir="ltr" value="${esc(L.umToken)}"></div>
 <div class="sec"><label class="chk" style="margin-top:12px"><input type="checkbox" id="w_auto" ${L.autoSend?'checked':''}> إرسال التذكيرات تلقائياً مرة باليوم عند فتح التطبيق</label>
 <label class="chk"><input type="checkbox" id="w_rec" ${L.autoReceipt?'checked':''}> إرسال الوصل للزبون تلقائياً بعد كل تسديد</label></div>`,
 `<button class="btn" onclick="saveWA()">حفظ</button><button class="btn sec" onclick="testWA()">إرسال تجربة</button>`)}
async function saveWA(){Object.assign(L,{waMode:v('w_mode'),umInstance:v('w_inst'),umToken:v('w_tok'),autoSend:document.getElementById('w_auto').checked,autoReceipt:document.getElementById('w_rec').checked});
 if(L.waMode==='api'&&(!L.umInstance||!L.umToken))return toast('اكتب Instance ID والـ Token');await saveL();closeSheet();toast('انحفظت');render()}
async function testWA(){if(!S.settings.phone)return toast('اكتب رقم المحل بمعلومات المحل أول');
 const inst=L.umInstance,tok=L.umToken;L.umInstance=v('w_inst');L.umToken=v('w_tok');const ok=await apiSend(S.settings.phone,'رسالة تجربة من نظام الأقساط ✓');
 L.umInstance=inst;L.umToken=tok;toast(ok?'انرسلت، شوف واتساب المحل':'ما انرسلت، تأكد من البيانات والإنترنت',3000)}

// ---------- القفل ----------
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('aqsat:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let unlockCb=null,pinBuf='';
function showLock(cb){unlockCb=cb;pinBuf='';if(document.getElementById('lock'))return;const o=document.createElement('div');o.id='lock';
 o.innerHTML=`<h2>${esc(S.settings.shop||'حسين علي')}</h2><div>اكتب الرمز</div><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}
 <button class="t" onclick="bioUnlock()">${L.bioId?'بصمة/وجه':''}</button><button onclick="pinKey('0')">0</button><button class="t" onclick="pinKey('x')">مسح</button></div>`;document.body.append(o)}
async function pinKey(k){if(k==='x')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
 document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length));
 if(pinBuf.length===4){if(await sha(pinBuf)===L.pinHash)unlock();else{const d=document.getElementById('dots');d.classList.add('shake');setTimeout(()=>{d.classList.remove('shake');pinBuf='';d.querySelectorAll('i').forEach(i=>i.classList.remove('f'))},400)}}}
function unlock(){document.getElementById('lock')?.remove();const cb=unlockCb;unlockCb=null;cb&&cb()}
async function bioUnlock(){if(!L.bioId)return;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
 allowCredentials:[{type:'public-key',id:unb64(L.bioId)}],userVerification:'required',timeout:60000}});unlock()}catch(e){toast('ما انفتح بالبصمة، اكتب الرمز')}}
function lockForm(){sheet('قفل التطبيق',`<div class="sec"><div class="sub" style="margin-top:10px">${L.pinHash?'القفل مفعّل. التطبيق يقفل إذا طلعت منه أكثر من دقيقة.':'حط رمز من ٤ أرقام حتى محد يفتح التطبيق غيرك.'}</div>
 <label>${L.pinHash?'رمز جديد':'الرمز'} (٤ أرقام)</label><input id="l_p1" type="password" inputmode="numeric" maxlength="4">
 <label>أعد الرمز</label><input id="l_p2" type="password" inputmode="numeric" maxlength="4"></div>
 ${L.pinHash?`<div class="acts"><button class="btn sec" onclick="setupBio()">${L.bioId?'إعادة تفعيل البصمة':'تفعيل البصمة/الوجه'}</button><button class="btn del" onclick="removePin()">إلغاء القفل</button></div>`:''}`,
 `<button class="btn" onclick="savePin()">حفظ الرمز</button>`)}
async function savePin(){const p1=en(v('l_p1')),p2=en(v('l_p2'));if(!/^\d{4}$/.test(p1))return toast('الرمز لازم ٤ أرقام');if(p1!==p2)return toast('الرمزين مو متطابقين');
 L.pinHash=await sha(p1);await saveL();toast('انحفظ الرمز');lockForm()}
function removePin(){showLock(async()=>{L.pinHash='';L.bioId='';await saveL();toast('انلغى القفل');closeSheet();render()})}
async function setupBio(){try{if(!window.PublicKeyCredential)throw 0;const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
 rp:{name:'حسين علي'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner',displayName:'صاحب المحل'},
 pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
 L.bioId=b64(cr.rawId);await saveL();toast('تفعلت البصمة/الوجه');lockForm()}catch(e){toast('هذا التلفون ما يدعم البصمة هنا، استخدم الرمز',3000)}}
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(L&&L.pinHash&&hiddenAt&&Date.now()-hiddenAt>60000)showLock(()=>{})});

// ---------- النسخة الاحتياطية ----------
function backupForm(){sheet('النسخة الاحتياطية',`<div class="sec"><div class="sub" style="margin-top:10px">صدّر نسخة كل أسبوع واحفظها بالواتساب أو التليكرام. إذا تبدل التلفون، افتح التطبيق وسوّي استيراد للملف.</div>
 <button class="btn full" onclick="exportData()">تصدير نسخة</button></div>
 <div class="sec"><h4>استيراد نسخة</h4><div class="acts" style="grid-template-columns:1fr 1fr">
 <label class="btn sec" style="margin:0;color:var(--teal);font-size:14px">استيراد ودمج<input type="file" accept=".json,application/json" hidden onchange="importData(this,'merge')"></label>
 <label class="btn del" style="margin:0;color:var(--late);font-size:14px">استيراد واستبدال<input type="file" accept=".json,application/json" hidden onchange="importData(this,'replace')"></label></div>
 <div class="sub" style="margin-top:10px">الدمج يجمع بيانات الملف ويا بيانات هذا التلفون (الأحدث يغلب). الاستبدال يمسح بيانات هذا التلفون ويحط النسخة بدالها.</div></div>`)}
async function exportData(){const images={};for(const c of S.customers)for(const k of ['idF','idB'])if(c[k]){const d=await imgGet(c[k]);if(d)images[c[k]]=d}
 const data=JSON.stringify({app:'aqsat',v:3,exported:new Date().toISOString(),data:S,images});
 const name=`aqsat-backup-${today()}.json`;const file=new File([data],name,{type:'application/json'});let done=false;
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});done=true}catch(e){if(e.name==='AbortError')return}}
 if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click()}
 L.lastBackup=Date.now();await saveL();toast('انحفظت النسخة');if(tab==='home')render()}
async function importData(inp,mode){const f=inp.files[0];inp.value='';if(!f)return;let J;
 try{J=JSON.parse(await f.text())}catch{return toast('الملف مو نسخة صحيحة')}
 if(J.app!=='aqsat'||!J.data)return toast('الملف مو نسخة من نظام الأقساط');
 if(mode==='replace'&&!confirm('راح تنمسح بيانات هذا التلفون وتنحط النسخة بدالها. متأكد؟'))return;
 for(const id in (J.images||{}))await imgPut(id,J.images[id]);
 if(mode==='replace')S=normalize(J.data);else{mergeInto(S,normalize(J.data))}
 await save();closeSheet();toast(mode==='replace'?'انستبدلت البيانات':'اندمجت البيانات');render()}
function mergeInto(A,B){const all=[...(A.deleted||[]),...(B.deleted||[])];const del=new Set(all.map(d=>d.t+':'+d.id));
 const seen=new Set();A.deleted=all.filter(d=>{const k=d.t+':'+d.id;if(seen.has(k))return false;seen.add(k);return true});
 for(const t of TABLES){const m=new Map((A[t]||[]).map(x=>[x.id,x]));
  (B[t]||[]).forEach(x=>{const o=m.get(x.id);if(!o||(x.updated||0)>(o.updated||0))m.set(x.id,x)});A[t]=[...m.values()].filter(x=>!del.has(t+':'+x.id))}
 if((B.settings?.updated||0)>(A.settings.updated||0))A.settings=Object.assign(A.settings,B.settings)}
// تحديث بيانات النسخ القديمة
function normalize(d){const s=Object.assign(EMPTY(),d||{});TABLES.forEach(t=>{if(!Array.isArray(s[t]))s[t]=[]});if(!Array.isArray(s.deleted))s.deleted=[];
 s.settings=Object.assign(EMPTY().settings,s.settings||{});if(!s.settings.shop)s.settings.shop='حسين علي';
 ['waRemind','waLate'].forEach(k=>{s.settings[k]=s.settings[k].replace(/(\{(المبلغ|المسدد|الباقي|المتأخر)\})\s*دينار/g,'$1').replace('قسط جهاز {الجهاز}','قسط {الجهاز}').replace('لجهاز {الجهاز}','عن {الجهاز}')});
 s.contracts.forEach(c=>{if(!c.kind)c.kind='device';if(!c.cur)c.cur='IQD'});return s}

// ================== تشغيل ==================
async function afterUnlock(){render();if(L.waMode==='api'&&L.autoSend&&L.lastAuto!==today()&&navigator.onLine){L.lastAuto=today();await saveL();bulkSend(true)}}
(async()=>{db=await idb();S=normalize(await tx('kv','readonly',s=>s.get('state')));L=Object.assign(LOCAL(),await tx('kv','readonly',s=>s.get('local'))||{});
 if(navigator.storage?.persist)navigator.storage.persist();
 if(L.pinHash)showLock(afterUnlock);else afterUnlock();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
